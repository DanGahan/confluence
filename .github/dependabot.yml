version: 2
updates:
  # Keeps the actions we reference (actions/checkout, github/codeql-action, etc.)
  # pinned to current majors. The app itself is zero-dep by policy, so no Swift
  # package ecosystem here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    # PRs go to `dev` — same flow as every other change.
    target-branch: "dev"
    # Wait a week before opening a PR for a newly-published version. Newly
    # released packages are a supply-chain risk window (compromised or
    # accidentally-broken releases get pulled quickly). Seven days is enough
    # for a bad release to be yanked or reported.
    cooldown:
      default-days: 7
