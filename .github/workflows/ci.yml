name: CI

# Runs on every PR to dev/main and every push to dev/main, and is invoked by both
# release workflows before they build so a bad commit can't cut a release. UI tests
# stay out of CI by policy (per docs/RELEASING.md → CI checks); they're a
# pre-merge local concern per CLAUDE.md's pyramid.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:

concurrency:
  # Cancel superseded PR runs but never cancel pushes to dev/main (release-critical).
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-package:
    name: Tests (unit + integration)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run ConfluenceKit tests
        run: swift test --package-path ConfluenceKit

  build-check:
    name: Build (app target, unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      # Debug build with signing disabled — catches app-target compile regressions
      # (which swift test alone doesn't cover) without needing any signing setup.
      - name: Build
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme Confluence \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  sast:
    name: SAST (Semgrep)
    # Runs on Linux — Semgrep is a source-only scanner, no macOS toolchain needed,
    # so it's ~10x cheaper than a macOS runner. CodeQL for Swift was tried and
    # dropped: both build-mode: manual and autobuild hung >30 min on this codebase
    # against Swift 6.2 / macOS 26 SDK. Semgrep runs in a couple of minutes and
    # uploads SARIF to the Security tab the same way CodeQL would have.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        # `p/default` is the curated recommended ruleset (OWASP-style patterns,
        # secret leaks, common footguns). Non-zero exit on findings blocks CI.
        # SARIF output is uploaded below so findings surface in Code Scanning.
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
