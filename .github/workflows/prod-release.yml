name: Prod release

# Manually invoked from the Actions tab. Version is YYYYMMDD (UTC), sortable
# and lexicographically comparable with prior releases. Runs only against
# branches that make sense as a prod cut — enforce `main` by default so a
# stray dispatch from a feature branch doesn't ship.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm you want to ship a prod build from this branch.'
        required: true
        default: ''

permissions:
  contents: write
  security-events: write # CodeQL upload
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation and branch
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euxo pipefail
          if [ "$CONFIRM" != "release" ]; then
            echo "::error::Type 'release' in the confirm input to proceed."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Prod releases must be dispatched from 'main' (got: $REF)."
            exit 1
          fi

  # Gate the release on the shared CI checks (tests + build + CodeQL). Guard runs
  # first so a wrong-branch or missing-confirm dispatch fails fast before we spend
  # runner minutes on the check suite.
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  build:
    needs: ci
    # macos-26 provides Swift 6.2 + the macOS 26 SDK — see dev-release.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        # YYYYMMDD in UTC. If a release already exists for today, suffix with -N
        # so multiple prod cuts on the same day don't collide.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          BASE="$(date -u +%Y%m%d)"
          TAG="$BASE"
          SUFFIX=1
          while gh release view "$TAG" >/dev/null 2>&1; do
            SUFFIX=$((SUFFIX + 1))
            TAG="${BASE}-${SUFFIX}"
          done
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Tests + build + CodeQL run in the `ci` job above; no need to repeat here.
      - uses: ./.github/actions/build-release
        with:
          version: ${{ steps.version.outputs.version }}
          commit: ${{ steps.version.outputs.commit }}

      - name: Publish prod release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          COMMIT_SHORT: ${{ steps.version.outputs.commit_short }}
        run: |
          set -euxo pipefail
          # ponytail: heredoc to a file, not $(cat <<EOF); command
          # substitution parses the body and chokes on apostrophes (don't).
          cat > notes.md <<EOF
          Prod release.

          - **Version**: \`${VERSION}\`
          - **Commit**: [\`${COMMIT_SHORT}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT})
          - **Branch**: \`main\`

          ## Install
          1. Unzip; drag \`Confluence.app\` to \`/Applications\`.
          2. Double-click — Gatekeeper will block with "could not verify" (expected: the app is ad-hoc signed, not notarised).
          3. Approve once, either:
             - **System Settings → Privacy & Security**, scroll to the bottom → **Open Anyway** → confirm with Touch ID.
             - Or Terminal: \`xattr -d com.apple.quarantine /Applications/Confluence.app\`

          Then double-click as normal. Subsequent launches don't re-prompt.
          EOF
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            --latest \
            --target "$GITHUB_SHA" \
            artefact/Confluence-${VERSION}.zip
