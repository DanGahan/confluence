# Source of truth for the Xcode project. Regenerate with: xcodegen generate
# Do not commit Confluence.xcodeproj — it is derived from this file.
name: Confluence
options:
  bundleIdPrefix: com.dangahan.confluence
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ConfluenceKit:
    path: ConfluenceKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Confluence:
    type: application
    # One multiplatform target — macOS + iOS from a single codebase (no fork).
    supportedDestinations: [macOS, iOS]
    sources:
      - Confluence
      # Icon Composer bundle — compiled straight into the app icon (Xcode 26).
      # Source art (the SVG layers it references) lives beside it in design/icon.
      - design/icon/app.icon
    dependencies:
      - package: ConfluenceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dangahan.confluence
        ASSETCATALOG_COMPILER_APPICON_NAME: app
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_CFBundleDisplayName: Confluence
        # Marketing version becomes CFBundleShortVersionString → shown in About.
        # Release workflows override on the command line:
        #   xcodebuild ... MARKETING_VERSION=YYYYMMDD (prod) or DEV_YYMMDDHHMM (dev)
        # The commit hash is injected into Info.plist by the workflow AFTER build
        # (Xcode's INFOPLIST_KEY_* only accepts a fixed set of Apple keys). Local
        # dev builds keep the default so About shows "dev / local".
        MARKETING_VERSION: "dev"
        # iOS launch screen + orientations (ignored by the macOS build). Auto-generated
        # empty launch screen; iPhone omits upside-down, iPad allows all four.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # macOS-only signing/runtime, SDK-conditioned so the iOS build (esp. the
        # simulator, which needs no signing) doesn't inherit them.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Confluence/Confluence.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # Stable local signing identity so Keychain "Always Allow" persists across rebuilds.
        # Create it once with scripts/create-dev-cert.sh. Replace with a real Apple
        # Development team for distribution.
        CODE_SIGN_STYLE[sdk=macosx*]: Manual
        CODE_SIGN_IDENTITY[sdk=macosx*]: "Confluence Dev"
        # With a real signing identity, hardened runtime is enforced and rejects Xcode's
        # separate debug dylib (different Team ID than our self-signed cert). Disable it.
        ENABLE_DEBUG_DYLIB[sdk=macosx*]: NO

  ConfluenceUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS, iOS]
    sources: [ConfluenceUITests]
    dependencies:
      - target: Confluence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dangahan.confluence.uitests

schemes:
  Confluence:
    build:
      targets:
        Confluence: all
        ConfluenceUITests: [test]
    test:
      targets:
        - ConfluenceUITests
